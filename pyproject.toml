[project]
name = "vps-deployer"
version = "0.3.3"
description = "Self-hosted VPS deployment platform"
readme = "README.md"
authors = [
    { name = "VPS Deployer" },
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0",
    "fastapi[standard]>=0.118.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.18",
    "pydantic-settings>=2.11.0",
    "pyjwt[crypto]>=2.14.0",
    "rich>=14.0.0",
    "sqlmodel>=0.0.24",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "ty>=0.0.5",
]

[project.scripts]
vps-deployer = "vps_deployer.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vps_deployer"]

[tool.hatch.build.targets.wheel.force-include]
"src/vps_deployer/dashboard/templates" = "vps_deployer/dashboard/templates"
"src/vps_deployer/dashboard/static" = "vps_deployer/dashboard/static"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/vps_deployer/cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ty.src]
include = ["src", "tests"]
