{% extends "base.html" %}
{% block content %}
<section class="hero">
  <h1>Sign in</h1>
  <p>This dashboard is public on this VPS. Enter the password set with <code>vps-deployer dashboard enable</code>.</p>
</section>
<section>
  <form class="stack" method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}" />
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password" />
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
